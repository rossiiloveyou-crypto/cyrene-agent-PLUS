<!doctype html>
<html lang="zh-CN" data-ui-theme="pearl-white">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>头像侧边菜单预览</title>
    <link rel="stylesheet" href="/ui/theme.css" />
    <link rel="stylesheet" href="/react/styles/react-root.css" />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 480px; min-height: 100vh; background: var(--rb-surface-page, #f5f5f7); color: var(--rb-text-primary, #1d1d1f); font: 400 13px/1.45 var(--rb-font-sans, system-ui, sans-serif); }
      .user-menu-preview { display: flex; min-height: 100vh; }
      .user-menu-preview__sidebar { display: flex; width: 252px; flex: 0 0 auto; flex-direction: column; padding: 18px 12px 12px; border-right: 1px solid var(--rb-border-subtle, #ece8ec); background: var(--rb-surface-workspace, #fff); }
      .user-menu-preview__brand { padding: 8px 10px 22px; font-size: 17px; font-weight: 650; }
      .user-menu-preview__nav { display: grid; gap: 5px; }
      .user-menu-preview__nav button, .user-menu-preview__bottom > button { min-height: 36px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: var(--rb-text-secondary, #777); font: inherit; text-align: left; }
      .user-menu-preview__nav button:first-child { background: color-mix(in srgb, var(--rb-accent, #ff5b8a) 10%, transparent); color: var(--rb-text-primary, #252229); }
      .user-menu-preview__bottom { display: grid; gap: 9px; margin-top: auto; padding-top: 12px; border-top: 1px solid var(--rb-border-subtle, #ece8ec); }
      .user-menu-preview__bottom .cy-user-avatar { min-height: 40px; padding: 4px 8px; border-radius: 9px; }
      .user-menu-preview__bottom .cy-user-avatar:hover { background: var(--rb-surface-hover, #f4f1f3); }
      .user-menu-preview__main { padding: 44px 38px; }
      .user-menu-preview__main h1 { margin: 0 0 8px; font-size: 19px; }
      .user-menu-preview__main p { margin: 0; color: var(--rb-text-secondary, #85858d); }
      @media (max-width: 600px) { .user-menu-preview__sidebar { width: 210px; } .user-menu-preview__main { padding: 30px 20px; } }
    </style>
  </head>
  <body>
    <div id="preview-root"></div>
    <script type="module" src="/react/components/ui/UserMenuPreview.tsx"></script>
  </body>
</html>
